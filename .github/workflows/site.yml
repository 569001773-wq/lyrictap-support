name: Website checks and production deployment
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:static
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Migrate the existing branch-root Pages source only after every check has passed.
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const {data} = await github.rest.repos.getPages({owner,repo});
            if (data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({owner,repo,build_type:'workflow'});
            }
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  production-smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          LIVE_BASE_URL: https://569001773-wq.github.io
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
